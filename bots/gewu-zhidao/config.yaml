model:
  default: agnes-3.0-flash
  provider: agnes-gewu-zhidao
  base_url: https://api.agnes-ai.cn/v1
  context_length: 512000
providers:
  agnes-flash:
    name: agnes-flash
    api: https://api.agnes-ai.cn/v1
    base_url: https://api.agnes-ai.cn/v1
    api_key: ''
    key_env: AGNES_FLASH_API_KEY
    discover_models: false
    context_length: 512000
    models:
      agnes-3.0-flash: {}
      agnes-2.0-flash: {}
      agnes-2.5-flash: {}
      agnes-2.5-pro: {}
  agnes-reason:
    name: agnes-reason
    api: https://api.agnes-ai.cn/v1
    base_url: https://api.agnes-ai.cn/v1
    api_key: ''
    key_env: AGNES_REASON_API_KEY
    discover_models: false
    context_length: 512000
    models:
      agnes-2.0-flash: {}
      agnes-2.5-flash: {}
      agnes-2.5-pro: {}
  agnes-media:
    name: agnes-media
    api: https://api.agnes-ai.cn/v1
    base_url: https://api.agnes-ai.cn/v1
    api_key: ''
    key_env: AGNES_MEDIA_API_KEY
    discover_models: false
    context_length: 512000
    models:
      agnes-image-2.1-flash: {}
      agnes-image-2.5-flash: {}
      agnes-video-2.5: {}
      agnes-video-2.5-flash: {}
  agnes-main:
    name: agnes-main
    api: https://apihub.agnes-ai.com/v1
    base_url: https://apihub.agnes-ai.com/v1
    api_key: ''
    key_env: AGNES_MAIN_API_KEY
    discover_models: false
    context_length: 512000
    models:
      agnes-3.0-flash: {}
      agnes-2.0-flash: {}
      agnes-2.5-flash: {}
      agnes-2.5-pro: {}
      agnes-image-2.1-flash: {}
      agnes-image-2.5-flash: {}
      agnes-video-2.5: {}
      agnes-video-2.5-flash: {}
  agnes-gewu-zhidao:
    name: agnes-gewu-zhidao
    api: https://api.agnes-ai.cn/v1
    base_url: https://api.agnes-ai.cn/v1
    key_env: AGNES_KEY_GEWU_ZHIDAO
    discover_models: false
    context_length: 512000
    models:
      agnes-3.0-flash: {}
fallback_providers:
  - provider: agnes-main
    model: agnes-3.0-flash
  - provider: agnes-flash
    model: agnes-3.0-flash
toolsets:
  - hermes-cli
agent:
  max_turns: 60
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  environment_hint: ''
  coding_context: auto
  gateway_timeout_warning: 900
  clarify_timeout: 600
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 3600
  image_input_mode: auto
  disabled_toolsets: []
  verbose: false
  reasoning_effort: medium
command_allowlist:
  - execute_code
  - script execution via -e/-c flag
  - script execution via heredoc
_config_version: 44

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
